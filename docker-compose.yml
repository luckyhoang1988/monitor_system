services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # ⚠️ KHÔNG dùng ${DB_USER}/${DB_PASSWORD} (nội suy cấp Compose) ở đây: cú pháp ${...}
    # trong docker-compose.yml chỉ được Compose nội suy từ 1 file tên đúng ".env" cạnh
    # file này (hoặc --env-file/shell env) — KHÔNG đọc qua `env_file:` bên dưới (đó chỉ
    # bơm biến vào container lúc chạy, không tham gia nội suy YAML). Dự án chỉ có
    # .env.production (không có .env ở prod) nên trước đây ${DB_USER} luôn rơi về default
    # monitor_user/change_me_db_password — khác hẳn credential thật mà app/worker/beat
    # nhận qua env_file, khiến Postgres và Django dùng 2 bộ credential khác nhau.
    # Fix: đọc thẳng POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD (tên biến chuẩn của
    # image postgres) từ .env.production qua env_file — không qua nội suy YAML nữa.
    # .env.production phải có 3 khoá này (mirror DB_NAME/DB_USER/DB_PASSWORD, xem
    # .env.example).
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ (không phải $) để Compose KHÔNG nội suy lúc build câu lệnh — để nguyên
      # $POSTGRES_USER/$POSTGRES_DB cho shell TRONG container tự thay bằng biến thật
      # (đã có sẵn từ env_file/entrypoint chính thức của image postgres), tránh lặp lại
      # đúng lỗi nội suy YAML ở trên.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      HOME: /tmp
      TZ: Asia/Ho_Chi_Minh
    # Cho phép ICMP ping từ user non-root (cho manage.py poll_device thủ công).
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    volumes:
      - static_volume:/app/staticfiles
      - backup_volume:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python urllib thay cho curl (image slim khong co curl)
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      HOME: /tmp
      TZ: Asia/Ho_Chi_Minh
    command: celery -A config worker -l info --concurrency=4
    # Cho phép ICMP ping từ user non-root (appuser) trong container.
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    volumes:
      - backup_volume:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      HOME: /tmp
      TZ: Asia/Ho_Chi_Minh
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  static_volume:
  backup_volume:
