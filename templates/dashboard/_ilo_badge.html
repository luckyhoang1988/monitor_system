<span class="badge bg-{{ summary.color }} {% if summary.color == 'warning' %}text-dark{% endif %}" title="{% if summary.error %}Lỗi poll: {{ summary.error }}; {% endif %}{% for problem in summary.problems %}{{ problem }}; {% endfor %}{% for name, ts in summary.carried.items %}{{ name }}: không đọc được ở lần poll mới nhất, dùng dữ liệu lúc {{ ts|date:'H:i:s d/m' }}; {% endfor %}{% for name, ts in summary.expired.items %}{{ name }}: không đọc được, lần cuối đọc được lúc {{ ts|date:'H:i:s d/m/Y' }}; {% endfor %}{% if summary.timestamp %}Cập nhật: {{ summary.timestamp|date:'d/m/Y H:i:s' }}{% endif %}">iLO: {{ summary.label }}{% if summary.stale %} · Dữ liệu cũ{% elif summary.carried or summary.expired %} · Thiếu dữ liệu{% endif %}{% if summary.error and summary.label != 'Mất kết nối' %} · Lỗi poll{% endif %}</span>
